[platformio]
default_envs = xiao

[env:xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; TinyUSB (OTG) mode so the port can be a HID keyboard; CDC kept for serial + auto-reset upload.
build_unflags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
build_flags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DUSE_NIMBLE
lib_deps =
  t-vk/ESP32 BLE Keyboard@^0.3.2
  ; BLE Keyboard doesn't build against NimBLE 2.x
  h2zero/NimBLE-Arduino@~1.4.3

; Host-side test of the key logic: pio test -e native  (needs gcc/MinGW on PATH)
[env:native]
platform = native
